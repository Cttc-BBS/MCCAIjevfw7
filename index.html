<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoplay Video</title>
</head>
<body style="margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: black;">
    <video id="vid" width="100%" height="auto" controls playsinline>
        <source src="assets/asset.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var video = document.getElementById("vid");

            // Try to autoplay with sound
            video.muted = false;
            var playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    console.log("Autoplay blocked, requiring user interaction.");
                    // Add click listener to enable playback
                    document.addEventListener("click", function enablePlayback() {
                        video.play();
                        document.removeEventListener("click", enablePlayback);
                    });
                });
            }
        });
    </script>
</body>
</html>
