<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Player</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene>
        <a-assets>
            <video 
                id="vid" 
                src="assets/asset.mp4" 
                preload="auto" 
                loop 
                playsinline 
                webkit-playsinline 
                crossorigin="anonymous">
            </video>
        </a-assets>

        <a-video 
            src="#vid" 
            scale="3 1.5 1" 
            position="0 1 -3" 
            rotation="0 0 0">
        </a-video>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Play video with sound when page is interacted with
        document.addEventListener("DOMContentLoaded", function () {
            var video = document.getElementById("vid");

            // Attempt to play the video with sound on user interaction
            function enableSound() {
                video.muted = false;
                video.play().catch(error => console.log("Autoplay with sound failed:", error));
                document.removeEventListener("click", enableSound);
            }

            document.addEventListener("click", enableSound);
        });
    </script>
</body>
</html>
