<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Player</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }
        video {
            width: 60vw;
            height: auto;
        }
    </style>
</head>
<body>
    <video id="vid" src="assets/asset.mp4" preload="auto" loop autoplay playsinline muted crossorigin="anonymous"></video>
</body>
</html>
