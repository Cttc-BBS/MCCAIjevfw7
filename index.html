<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Autoplay with Sound</title>
</head>
<body style="margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background: black;">
    
    <video id="vid"
        src="assets/asset.mp4"
        preload="auto"
        loop
        autoplay
        muted
        playsinline
        style="max-width: 100%; max-height: 100%;"
    ></video>

    <script>
        async function enableAudio() {
            let video = document.getElementById("vid");
            let context = new (window.AudioContext || window.webkitAudioContext)();
            let source = context.createMediaElementSource(video);
            let gainNode = context.createGain();

            source.connect(gainNode);
            gainNode.connect(context.destination);

            try {
                await context.resume(); // Try resuming audio context
                video.muted = false;
                await video.play(); // Attempt to play the video with sound
                console.log("Video playing with sound.");
            } catch (error) {
                console.warn("Autoplay with sound blocked. Waiting for user interaction.");

                // Fallback: Request user interaction
                document.body.addEventListener("click", () => {
                    context.resume().then(() => {
                        video.muted = false;
                        video.play();
                        console.log("Video unmuted on user interaction.");
                    });
                }, { once: true });
            }
        }

        window.onload = enableAudio;
    </script>

</body>
</html>
