<!doctype html>
<html>
    <head>
        <title>Video Autoplay</title>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var video = document.getElementById("vid");
                video.muted = false;
                video.play();
            });
        </script>
    </head>
    <body style="margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: black;">
        <video 
            id="vid" 
            src="assets/asset.mp4" 
            preload="auto" 
            loop 
            autoplay 
            playsinline 
            controls 
            style="max-width: 100%; height: auto;">
        </video>
    </body>
</html>
