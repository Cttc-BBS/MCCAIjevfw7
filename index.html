<!doctype html>
<html>
    <head>
        <title>Video Autoplay</title>
    </head>
    <body style="margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background: black;">
        <video
            id="vid"
            src="assets/asset.mp4"
            preload="auto"
            loop
            autoplay
            muted
            playsinline
            style="max-width: 100%; max-height: 100%;"
        ></video>
        <script>
            window.onload = () => {
                let video = document.getElementById("vid");
                video.muted = true;
                video.play().then(() => {
                    video.muted = false;
                }).catch(error => {
                    console.warn("Autoplay with sound was blocked:", error);
                });
            };
        </script>
    </body>
</html>
