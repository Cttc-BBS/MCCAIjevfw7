<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Player</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene>
        <a-assets>
            <video 
                id="vid" 
                src="assets/asset.mp4" 
                preload="auto" 
                loop 
                autoplay 
                playsinline 
                webkit-playsinline 
                muted 
                crossorigin="anonymous">
            </video>
        </a-assets>

        <a-video 
            src="#vid" 
            scale="3 1.5 1" 
            position="0 1 -3" 
            rotation="0 0 0">
        </a-video>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
