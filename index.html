<!doctype html>
<html>
    <head>
        <title>Video Autoplay with Sound</title>
    </head>
    <body style="margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background: black;">
        <video
            id="vid"
            src="assets/asset.mp4"
            preload="auto"
            loop
            playsinline
            style="max-width: 100%; max-height: 100%; display: none;"
        ></video>

        <div id="popup" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center;">
            <div style="background: white; padding: 20px; text-align: center; border-radius: 10px;">
                <p>Do you want to play the video with sound?</p>
                <button id="playWithSound" style="margin: 10px; padding: 10px; cursor: pointer;">Yes</button>
                <button id="closePopup" style="margin: 10px; padding: 10px; cursor: pointer;">No</button>
            </div>
        </div>

        <script>
            document.getElementById("playWithSound").addEventListener("click", function () {
                let video = document.getElementById("vid");
                video.style.display = "block";
                video.muted = false;
                video.play();
                document.getElementById("popup").style.display = "none";
            });

            document.getElementById("closePopup").addEventListener("click", function () {
                document.getElementById("popup").style.display = "none";
            });
        </script>
    </body>
</html>
